# dsh-composer-ease —— DSH bundle patch
# 插入 web profile 配置树：服务端注册 /dsh-composer-ease/* 路由，浏览器侧半（exports["./client"]）
# 进 boot 图提供键位与补全弹层。
# 安装（本地或 git 克隆后）：dsh plugin --profile web add "<本仓路径>/dsh-composer-ease"
# 安装（npm，发布后）：dsh plugin --profile web add dsh-composer-ease
# 卸载：dsh plugin --profile web remove dsh-composer-ease
# 客户端半边要重启 dsh web 才进 boot 图（服务端半边新加条目可热挂）。

- insert:
    - id: dsh-composer-ease
      name: dsh-composer-ease
