<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="dsh-composer-pro：把 DSH 输入框做成 VS Code 手感">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161d"/>
      <stop offset="1" stop-color="#1b2029"/>
    </linearGradient>
  </defs>
  <rect width="880" height="220" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="879" height="219" rx="13.5" fill="none" stroke="#2b3240"/>

  <text x="40" y="64" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="27" font-weight="600" fill="#e8edf5">dsh-composer-pro</text>
  <text x="40" y="94" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="14.5" fill="#93a1b5">把 DSH 输入框做成 VS Code 手感：配对、环绕、跳闭合，外加四类候选的补全弹层</text>

  <g font-family="ui-monospace, Consolas, monospace" font-size="13">
    <rect x="40" y="150" width="360" height="34" rx="8" fill="#0e1218" stroke="#2b3240"/>
    <text x="54" y="172" fill="#e8edf5">临时目录/attrib-<tspan fill="#6ea8fe">index</tspan></text>

    <rect x="40" y="112" width="470" height="30" rx="6" fill="#161b23" stroke="#2f3846"/>
    <text x="52" y="132" fill="#dfe7f2">临时目录/attrib-index.diff<tspan fill="#7d8798" font-size="11">  Replying</tspan></text>

    <rect x="352" y="188" width="26" height="22" rx="5" fill="#1d2430" stroke="#2b3240"/>
    <text x="361" y="204" fill="#9fb0c6">(</text>
    <rect x="384" y="188" width="26" height="22" rx="5" fill="#1d2430" stroke="#2b3240"/>
    <text x="393" y="204" fill="#9fb0c6">[</text>
    <rect x="416" y="188" width="26" height="22" rx="5" fill="#1d2430" stroke="#2b3240"/>
    <text x="424" y="204" fill="#9fb0c6">{</text>
    <text x="458" y="204" fill="#7d8798" font-size="12">自动配对 / 选中环绕 / 跳闭合 / 删空对</text>
  </g>

  <text x="560" y="132" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="13" fill="#93a1b5">补全候选四类</text>
  <g font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="12.5" fill="#c7d3e3">
    <text x="560" y="156">本文词（草稿里出现过的标识符）</text>
    <text x="560" y="176">语言词表（HTML / JS / Python / Java / CSS）</text>
    <text x="560" y="196">工作区文件路径（按路径段前缀匹配）</text>
  </g>
</svg>
