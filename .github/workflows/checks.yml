name: checks

# 照 deepseek-harness 的分工：每条约定都有一个可跑的 tools/check-*.mjs，
# CI 只负责把这些闸拉起来，不在这里写判据。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 结构闸 / 重复机制闸 / 重构到期闸
        run: npm run check
      - name: 生成物与片段一致
        run: node tools/build-client.mjs --check
      - name: 文档闸（本地链接 + 预算）
        run: node tools/check-docs.mjs
      - name: 五支离线套件
        run: npm test
      - name: 发布一致性（package.json 版本 vs CHANGELOG 首条）
        run: node tools/check-release.mjs
      - name: 发布闸的自测（证明这道闸真的有牙）
        run: node tools/check-release.mjs --selftest
